# Refer to https://harborframework.com/docs/task-format for more details.

schema_version = "1.0"

[task]
name = "samaya-ai/{task_id}"
description = "FrontierFinance query {query_id}: write a financial research report graded against expert rubrics."
authors = [
    { name = "Yuhao Zhang" },
    { name = "O. Ozan Koyluoglu" },
    { name = "Thejas Venkatesh" },
    { name = "Richard Diehl Martinez" },
    { name = "Vishank Bhatia" },
    { name = "Arash Alidoust" },
    { name = "Ashwin Paranjape" },
]
keywords = ["finance", "deep-research", "report-writing", "llm-as-a-judge", "rubrics"]

[metadata]
difficulty = "hard"
category = "finance"
source_query_id = "{query_id}"
use_cases = {use_cases}
capabilities = {capabilities}

[verifier]
# Sized per task by the adapter from the rubric count (sequential judge calls).
timeout_sec = {verifier_timeout_sec}

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"
OPENAI_API_KEY = "${OPENAI_API_KEY}"
GEMINI_API_KEY = "${GEMINI_API_KEY}"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 4096
storage_mb = 10240
